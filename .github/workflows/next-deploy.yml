
name: Deploy Next.js App

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Select the GitHub Environment based on the branch
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    env:
      WEBAPP_NAME: ${{ vars.WEBAPP_NAME }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      APPLICATION_PUBLISH_PROFILE: ${{ secrets.APP_PUBLISH_PROFILE }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        working-directory: my-app
        run: npm ci

      - name: Build Next.js application
        working-directory: my-app
        run: |
          npm run build
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/. .next/standalone/.next/static/

          if [ -d public ]; then
            cp -r public .next/standalone/public
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          slot-name: Production
          publish-profile: ${{ env.APPLICATION_PUBLISH_PROFILE }}
          package: ./my-app/.next/standalone
